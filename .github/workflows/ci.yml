name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The extension targets GNOME Shell 50, but the unit tests, schema, syntax
    # checks, packaging, and isolated install probe run on a current runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-bin gnome-shell unzip

      - name: Check shell scripts
        run: bash -n tests/headless-install-probe.sh scripts/cycle-extension.sh

      - name: Check license copy
        run: cmp LICENSE extension/LICENSE

      - name: Compile schema strictly
        run: glib-compile-schemas --strict extension/schemas

      - name: Run check
        run: make check
